[project]
name = "orgscope"
version = "0.1.0"
description = "Оргскоп — ИИ-агент сравнения оргструктуры и функций до и после реорганизации"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
orgscope = "orgdiff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
