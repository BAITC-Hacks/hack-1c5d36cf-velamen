[project]
name = "orgdiff"
version = "0.1.0"
description = "Сравнение организационной структуры и функций с проверяемыми источниками"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "openai>=3.19.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "tiktoken>=0.14.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
